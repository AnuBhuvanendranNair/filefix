<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <path fill="#8E1A1A" d="M0 0h64v64H0z"/>
  <g transform="translate(32 32) scale(0.82) translate(-32 -32)">
    <!-- box body -->
    <rect x="10" y="26" width="44" height="28" rx="3"
          fill="none" stroke="#FFF" stroke-width="3" stroke-linejoin="round"/>
    <!-- box lid -->
    <rect x="8" y="20" width="48" height="9" rx="2"
          fill="none" stroke="#FFF" stroke-width="3" stroke-linejoin="round"/>
    <!-- lock shackle -->
    <path d="M24 20 L24 14 Q24 8 32 8 Q40 8 40 14 L40 20"
          fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
    <!-- vertical bars suggesting cage/quarantine -->
    <line x1="21" y1="26" x2="21" y2="54" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
    <line x1="32" y1="26" x2="32" y2="54" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
    <line x1="43" y1="26" x2="43" y2="54" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
