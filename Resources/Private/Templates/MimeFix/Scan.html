<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:layout name="Module" />

<f:section name="Content">

<f:be.pageRenderer includeJavaScriptModules="{0: '@anubit/filefix/mimefix-scan.js'}" />
<f:comment>Translated labels for the JavaScript modules</f:comment>
<div id="filefix-labels" hidden="hidden" data-labels="{jsLabels -> f:format.json()}"></div>

<div id="filefix-loading" class="d-none position-fixed top-0 start-0 w-100 h-100 flex-column align-items-center justify-content-center gap-2 bg-body bg-opacity-75" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:1050;background-color:rgba(var(--bs-body-bg-rgb, 255, 255, 255), .75)">
    <core:icon identifier="spinner-circle" size="large" />
    <span class="text-body-secondary"><f:translate key="common.loading" extensionName="Filefix" /></span>
</div>

<h1>
    {folderName}
    <f:if condition="{mismatchCount} > 0">
        <small class="text-body-secondary fs-6 fw-normal ms-2"><f:translate key="mime.issues" extensionName="Filefix" arguments="{0: mismatchCount}" /></small>
    </f:if>
</h1>

<f:if condition="{mismatchCount} > 0">
    <f:then>
        <form action="{fixActionUrl}" method="post" id="mimefixFixForm">
            <input type="hidden" name="mimefix_fix" value="1" />
            <input type="hidden" name="folderId" value="{folderIdentifier}" />

            <div class="row row-cols-auto gx-2 mb-2 align-items-center">
                <div class="col">
                    <strong><f:translate key="clean.selection" extensionName="Filefix" /></strong>
                </div>
                <div class="col">
                    <button type="button" class="btn btn-default btn-sm" id="mimefix-select-all">
                        <core:icon identifier="actions-check" size="small" />
                        <span id="mimefix-select-label"><f:translate key="mime.selectActionable" extensionName="Filefix" arguments="{0: selectableCount}" /></span>
                    </button>
                </div>
                <div class="col">
                    <button type="button" class="btn btn-default btn-sm" id="mimefix-fix-btn">
                        <core:icon identifier="actions-document-synchronize" size="small" />
                        <f:translate key="mime.fixSelected" extensionName="Filefix" />
                    </button>
                </div>
            </div>

            <div class="table-fit">
                <table class="table table-striped table-hover" id="typo3-mimefix">
                    <thead>
                        <tr>
                            <th class="col-checkbox"></th>
                            <th><f:translate key="mime.col.file" extensionName="Filefix" /></th>
                            <th><f:translate key="mime.col.extension" extensionName="Filefix" /></th>
                            <th><f:translate key="mime.col.actual" extensionName="Filefix" /></th>
                            <th><f:translate key="mime.col.expected" extensionName="Filefix" /></th>
                            <th><f:translate key="mime.col.db" extensionName="Filefix" /></th>
                            <th><f:translate key="mime.col.status" extensionName="Filefix" /></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{mismatches}" as="item">
                            <tr>
                                <td class="col-checkbox">
                                    <f:if condition="{item.selectable}">
                                        <f:then>
                                            <input type="checkbox" name="files[]"
                                                value="{item.path}" class="mimefix-checkbox" />
                                        </f:then>
                                        <f:else>&mdash;</f:else>
                                    </f:if>
                                </td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <core:icon identifier="mimetypes-media-image" size="small" />
                                        <code class="small">{item.relativePath}</code>
                                    </div>
                                </td>
                                <td><code>.{item.extension}</code></td>
                                <td><code>{item.actualMime}</code></td>
                                <td><code>{item.expectedMime}</code></td>
                                <td>
                                    <f:if condition="{item.dbMime}">
                                        <f:then>
                                            <code class="{f:if(condition: item.dbOutOfSync, then: 'text-danger')}">{item.dbMime}</code>
                                        </f:then>
                                        <f:else>
                                            <span class="text-body-secondary"><f:translate key="mime.notIndexed" extensionName="Filefix" /></span>
                                        </f:else>
                                    </f:if>
                                </td>
                                <td>
                                    <f:if condition="{item.contentMismatch}">
                                        <f:then>
                                            <f:if condition="{item.fixable}">
                                                <f:then>
                                                    <span class="badge badge-warning">
                                                        <core:icon identifier="actions-exclamation-triangle" size="small" />
                                                        <f:translate key="mime.fixable" extensionName="Filefix" />
                                                    </span>
                                                </f:then>
                                                <f:else>
                                                    <span class="badge badge-danger"><f:translate key="mime.cannotFix" extensionName="Filefix" /></span>
                                                </f:else>
                                            </f:if>
                                        </f:then>
                                        <f:else>
                                            <span class="badge badge-info">
                                                <core:icon identifier="actions-database" size="small" />
                                                <f:translate key="mime.dbOutOfSync" extensionName="Filefix" />
                                            </span>
                                        </f:else>
                                    </f:if>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </form>
    </f:then>
    <f:else>
        <div class="t3-filelist-info-container">
            <core:icon identifier="actions-check" size="large" />
            <h5 class="mt-2"><f:translate key="mime.noIssues" extensionName="Filefix" /></h5>
            <p><f:translate key="mime.noIssues.text" extensionName="Filefix" arguments="{0: folderName}" /></p>
        </div>
    </f:else>
</f:if>

</f:section>
</html>
