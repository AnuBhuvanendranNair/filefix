<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:layout name="Module" />

<f:section name="Content">

<f:be.pageRenderer includeJavaScriptModules="{0: '@anubit/filefix/file-cleanup.js'}" />
<f:comment>Translated labels for the JavaScript modules</f:comment>
<div id="filefix-labels" hidden="hidden" data-labels="{jsLabels -> f:format.json()}"></div>

<div id="filefix-loading" class="d-none position-fixed top-0 start-0 w-100 h-100 flex-column align-items-center justify-content-center gap-2 bg-body bg-opacity-75" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:1050;background-color:rgba(var(--bs-body-bg-rgb, 255, 255, 255), .75)">
    <core:icon identifier="spinner-circle" size="large" />
    <span class="text-body-secondary"><f:translate key="common.loading" extensionName="Filefix" /></span>
</div>

<h1><f:translate key="clean.title" extensionName="Filefix" /></h1>

<f:if condition="{totalUnfiltered} == 0">
    <div class="t3-filelist-info-container">
        <core:icon identifier="actions-check" size="large" />
        <h5 class="mt-2"><f:translate key="clean.allClean" extensionName="Filefix" /></h5>
        <p><f:if condition="{folderName} != ''"><f:then><f:translate key="clean.allClean.textFolder" extensionName="Filefix" arguments="{0: folderName}" /></f:then><f:else><f:translate key="clean.allClean.text" extensionName="Filefix" /></f:else></f:if></p>
    </div>
</f:if>

<!-- ── Unused Files ─────────────────────────────────────────────────────── -->
<f:if condition="{totalUnfiltered} > 0">
    <div class="row align-items-center mb-2">
        <div class="col">
            <h2 class="mb-0">
                <core:icon identifier="mimetypes-media-image" size="small" />
                <f:translate key="clean.unused" extensionName="Filefix" />
                <small class="text-body-secondary fs-6 fw-normal ms-2"><f:translate key="clean.unused.subtitle" extensionName="Filefix" arguments="{0: unusedCount}" /><f:if condition="{folderName} != ''"> <f:translate key="common.in" extensionName="Filefix" /> <strong>{folderName}</strong></f:if></small>
            </h2>
        </div>
        <div class="col-auto d-flex align-items-center gap-2">

            <!-- ── Show filter dropdown ── -->
            <form method="get" action="{cleanupActionUrl}" class="d-inline">
                <input type="hidden" name="id" value="{folderId}" />
                <input type="hidden" name="perPage" value="{perPage}" />
                <input type="hidden" name="ext" value="{extFilter}" />
                <input type="hidden" name="viewMode" value="{viewMode}" />
                <select name="show" class="form-select form-select-sm" style="width:auto"
                        data-filefix-autosubmit="1">
                    <option value="all"     <f:if condition="{showFilter} == 'all'">selected="selected"</f:if>><f:translate key="clean.show.all" extensionName="Filefix" /></option>
                    <option value="present" <f:if condition="{showFilter} == 'present'">selected="selected"</f:if>><f:translate key="clean.show.present" extensionName="Filefix" /></option>
                    <option value="missing" <f:if condition="{showFilter} == 'missing'">selected="selected"</f:if>><f:translate key="clean.show.missing" extensionName="Filefix" /></option>
                </select>
            </form>

            <!-- ── Extension filter dropdown ── -->
            <f:if condition="{availableExtensions}">
                <form method="get" action="{cleanupActionUrl}" class="d-inline">
                    <input type="hidden" name="id" value="{folderId}" />
                    <input type="hidden" name="perPage" value="{perPage}" />
                    <input type="hidden" name="show" value="{showFilter}" />
                    <input type="hidden" name="viewMode" value="{viewMode}" />
                    <select name="ext" class="form-select form-select-sm" style="width:auto"
                            data-filefix-autosubmit="1">
                        <option value="" <f:if condition="{extFilter} == ''">selected="selected"</f:if>><f:translate key="clean.allTypes" extensionName="Filefix" /></option>
                        <f:for each="{availableExtensions}" as="extOption">
                            <option value="{extOption}" <f:if condition="{extFilter} == {extOption}">selected="selected"</f:if>>.{extOption}</option>
                        </f:for>
                    </select>
                </form>
            </f:if>

            <!-- ── View mode toggle ── -->
            <div class="btn-group" role="group" aria-label="{f:translate(key: 'clean.viewMode', extensionName: 'Filefix')}">
                <a href="{viewListUrl}" data-filefix-view="list"
                   class="btn btn-sm {f:if(condition:'{viewMode} == \'list\'', then:'btn-primary', else:'btn-default')}">
                    <core:icon identifier="actions-viewmode-list" size="small" /> <f:translate key="clean.list" extensionName="Filefix" />
                </a>
                <a href="{viewThumbsUrl}" data-filefix-view="thumbs"
                   class="btn btn-sm {f:if(condition:'{viewMode} == \'thumbs\'', then:'btn-primary', else:'btn-default')}">
                    <core:icon identifier="actions-viewmode-tiles" size="small" /> <f:translate key="clean.thumbnails" extensionName="Filefix" />
                </a>
            </div>

            <span class="text-body-secondary small"><f:translate key="clean.show" extensionName="Filefix" /></span>
            <form method="get" action="{cleanupActionUrl}" class="d-inline">
                <input type="hidden" name="id" value="{folderId}" />
                <input type="hidden" name="show" value="{showFilter}" />
                <input type="hidden" name="ext" value="{extFilter}" />
                <input type="hidden" name="viewMode" value="{viewMode}" />
                <select name="perPage" class="form-select form-select-sm" style="width:auto"
                        data-filefix-autosubmit="1">
                    <f:for each="{perPageOptions}" as="opt">
                        <option value="{opt.value}"
                            <f:if condition="{opt.active}">selected="selected"</f:if>>{opt.value}</option>
                    </f:for>
                </select>
            </form>
            <form id="flush-folder-form" action="{cleanupActionUrl}" method="post" class="d-inline">
                <input type="hidden" name="cleanup_type" value="flush_folder" />
                <input type="hidden" name="redirect_folder_id" value="{folderId}" />
                <input type="hidden" name="redirect_show" value="{showFilter}" />
                <input type="hidden" name="redirect_per_page" value="{perPage}" />
                <input type="hidden" name="redirect_ext" value="{extFilter}" />
                <input type="hidden" name="redirect_view_mode" value="{viewMode}" />
                <button type="button" id="flush-folder-btn" class="btn btn-danger btn-sm"
                        data-count="{unusedCount}" <f:if condition="{unusedCount} == 0">disabled="disabled"</f:if>>
                    <core:icon identifier="actions-delete" size="small" />
                    <f:translate key="clean.deleteAllFiltered" extensionName="Filefix" arguments="{0: unusedCount}" />
                </button>
            </form>
        </div>
    </div>

    <form action="{cleanupActionUrl}" method="post" id="cleanup-unused-form">
        <input type="hidden" name="cleanup_type" value="unused_files" />
        <input type="hidden" name="redirect_folder_id" value="{folderId}" />
        <input type="hidden" name="redirect_show" value="{showFilter}" />
        <input type="hidden" name="redirect_per_page" value="{perPage}" />
        <input type="hidden" name="redirect_ext" value="{extFilter}" />
        <input type="hidden" name="redirect_view_mode" value="{viewMode}" />

        <div class="row row-cols-auto gx-2 mb-2 align-items-center">
            <div class="col">
                <strong><f:translate key="clean.selection" extensionName="Filefix" /></strong>
            </div>
            <div class="col">
                <button type="button" class="btn btn-default btn-sm" id="cleanup-select-all-unused">
                    <core:icon identifier="actions-check" size="small" />
                    <span id="cleanup-label-unused"><f:translate key="clean.selectAll" extensionName="Filefix" /></span>
                </button>
            </div>
            <div class="col">
                <button type="submit" class="btn btn-default btn-sm"
                        formaction="{downloadZipUrl}">
                    <core:icon identifier="actions-download" size="small" />
                    <f:translate key="clean.downloadZip" extensionName="Filefix" />
                </button>
            </div>
            <div class="col">
                <button type="button" id="delete-selected-btn" class="btn btn-danger btn-sm">
                    <core:icon identifier="actions-delete" size="small" />
                    <f:translate key="clean.deleteSelected" extensionName="Filefix" />
                </button>
            </div>
        </div>

        <!-- Both views are rendered; file-cleanup.js switches between them without a reload.
             Checkboxes in the hidden view are disabled so file_uids[] is submitted only once. -->
        <div data-filefix-view-panel="thumbs" class="{f:if(condition:'{viewMode} != \'thumbs\'', then:'d-none')}">
                <div class="row row-cols-auto g-3 filefix-cleanup-thumbs">
                    <f:if condition="{unusedCount} == 0">
                        <div class="col text-body-secondary"><f:translate key="clean.noMatch" extensionName="Filefix" /></div>
                    </f:if>
                    <f:for each="{unusedFiles}" as="file">
                        <div class="col" style="width:150px">
                            <label class="card h-100 filefix-cleanup-thumb-card mb-0" style="cursor:pointer">
                                <div class="d-flex align-items-center justify-content-center bg-body-secondary"
                                     style="height:150px; overflow:hidden">
                                    <f:if condition="{file.thumbnailUrl}">
                                        <f:then>
                                            <img src="{file.thumbnailUrl}" alt="{file.name}"
                                                 style="max-width:100%; max-height:100%; object-fit:contain" />
                                        </f:then>
                                        <f:else>
                                            <core:icon identifier="mimetypes-media-image" size="large" />
                                        </f:else>
                                    </f:if>
                                </div>
                                <div class="card-body p-2">
                                    <div class="d-flex align-items-start gap-1">
                                        <input type="checkbox" name="file_uids[]"
                                            value="{file.uid}" class="cleanup-checkbox cleanup-unused mt-1"
                                            {f:if(condition:'{viewMode} != \'thumbs\'', then:'disabled="disabled"')} />
                                        <div class="small text-truncate" title="{file.identifier}">{file.name}</div>
                                    </div>
                                    <f:if condition="{file.physicallyMissing}">
                                        <span class="badge bg-warning text-dark"><f:translate key="clean.missing" extensionName="Filefix" /></span>
                                    </f:if>
                                    <div class="text-body-secondary" style="font-size:.75rem">
                                        <f:format.bytes decimals="1">{file.size}</f:format.bytes>
                                    </div>
                                </div>
                            </label>
                        </div>
                    </f:for>
                </div>
        </div>
        <div data-filefix-view-panel="list" class="{f:if(condition:'{viewMode} == \'thumbs\'', then:'d-none')}">
                <div class="table-fit">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th class="col-checkbox"></th>
                                <th><f:translate key="common.path" extensionName="Filefix" /></th>
                                <th><f:translate key="clean.col.mimeType" extensionName="Filefix" /></th>
                                <th><f:translate key="clean.col.size" extensionName="Filefix" /></th>
                                <th><f:translate key="clean.col.modified" extensionName="Filefix" /></th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:if condition="{unusedCount} == 0">
                                <tr>
                                    <td colspan="6" class="text-body-secondary"><f:translate key="clean.noMatch" extensionName="Filefix" /></td>
                                </tr>
                            </f:if>
                            <f:for each="{unusedFiles}" as="file">
                                <tr>
                                    <td class="col-checkbox">
                                        <input type="checkbox" name="file_uids[]"
                                            value="{file.uid}" class="cleanup-checkbox cleanup-unused"
                                            {f:if(condition:'{viewMode} == \'thumbs\'', then:'disabled="disabled"')} />
                                    </td>
                                    <td>
                                        <f:if condition="{file.physicallyMissing}">
                                            <f:then>
                                                <div class="d-flex align-items-center gap-1">
                                                    <span class="text-warning"><core:icon identifier="actions-exclamation-triangle" size="small" /></span>
                                                    <code class="small text-danger">{file.identifier}</code>
                                                    <span class="badge bg-warning text-dark ms-1"><f:translate key="clean.physicallyMissing" extensionName="Filefix" /></span>
                                                </div>
                                            </f:then>
                                            <f:else>
                                                <code class="small">{file.identifier}</code>
                                            </f:else>
                                        </f:if>
                                    </td>
                                    <td><code>{file.mime_type}</code></td>
                                    <td class="text-nowrap"><f:format.bytes decimals="1">{file.size}</f:format.bytes></td>
                                    <td class="text-nowrap"><f:format.date format="Y-m-d">{file.tstamp}</f:format.date></td>
                                    <td class="text-nowrap">
                                        <f:if condition="!{file.physicallyMissing}">
                                            <a href="{storagePublicBase}{file.identifier}"
                                               download="{file.name}"
                                               class="btn btn-default btn-sm"
                                               title="{f:translate(key: 'clean.downloadBackup', extensionName: 'Filefix')}">
                                                <core:icon identifier="actions-download" size="small" />
                                            </a>
                                        </f:if>
                                    </td>
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </div>
        </div>
    </form>

    <!-- Pagination -->
    <div class="row align-items-center mt-1 mb-4">
        <div class="col">
            <small class="text-body-secondary"><f:translate key="clean.showing" extensionName="Filefix" arguments="{0: rangeFrom, 1: rangeTo, 2: unusedCount}" /></small>
        </div>
        <div class="col-auto d-flex align-items-center gap-2">
            <f:if condition="{prevPageUrl}">
                <a href="{prevPageUrl}" class="btn btn-default btn-sm">
                    <core:icon identifier="actions-arrow-left" size="small" /> <f:translate key="common.previous" extensionName="Filefix" />
                </a>
            </f:if>
            <span class="text-body-secondary small"><f:translate key="common.pageOf" extensionName="Filefix" arguments="{0: currentPage, 1: totalPages}" /></span>
            <f:if condition="{nextPageUrl}">
                <a href="{nextPageUrl}" class="btn btn-default btn-sm">
                    <f:translate key="common.next" extensionName="Filefix" /> <core:icon identifier="actions-arrow-right" size="small" />
                </a>
            </f:if>
        </div>
    </div>
</f:if>

</f:section>
</html>
